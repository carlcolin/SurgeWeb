<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070b14" />
  <title>Surge Console</title>
  <link rel="icon" type="image/jpeg" sizes="96x96" href="favicon.jpg" />
  <link rel="apple-touch-icon" sizes="96x96" href="favicon.jpg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="grid"></div>
  </div>

  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M13 2 4.5 13.2h6.1L10 22l9.5-11.6h-6.2L13 2Z" fill="currentColor"/></svg>
        </div>
        <div class="brand-text">
          <strong>SURGE</strong>
          <span>CONSOLE</span>
        </div>
      </div>

      <nav class="nav" aria-label="主导航">
        <a class="nav-item" href="#/overview" data-nav="overview">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 13.5 12 5l8 8.5M6.5 12v7h11v-7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>概览</span>
        </a>
        <a class="nav-item" href="#/traffic" data-nav="traffic">
          <svg viewBox="0 0 24 24" fill="none"><path d="M3 12h4l2.4-7 4.2 14 2.4-7H21" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>实时统计</span>
          <span class="nav-dot" id="nav-traffic-dot" hidden></span>
        </a>
        <a class="nav-item" href="#/policies" data-nav="policies">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 3 4.5 6.5v5c0 4.6 3.2 8 7.5 9.5 4.3-1.5 7.5-4.9 7.5-9.5v-5L12 3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="m9 12 2 2 4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>策略</span>
          <span class="nav-badge" id="nav-policy-count">—</span>
        </a>
        <a class="nav-item" href="#/requests" data-nav="requests">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h10M4 17h13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="18.5" cy="17" r="2.2" stroke="currentColor" stroke-width="1.7"/></svg>
          <span>请求</span>
          <span class="nav-dot" id="nav-active-dot" hidden></span>
        </a>
        <a class="nav-item" href="#/dns" data-nav="dns">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.7"/><path d="M4 12h16M12 4c2.2 2.3 3.2 5 3.2 8S14.2 17.7 12 20M12 4c-2.2 2.3-3.2 5-3.2 8s1 5.7 3.2 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <span>DNS</span>
          <span class="nav-badge" id="nav-dns-count">—</span>
        </a>
        <a class="nav-item" href="#/resources" data-nav="resources">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5v-9Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M4.5 7.8 12 12l7.5-4.2M12 12v8.5" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
          <span>资源</span>
        </a>
        <a class="nav-item" href="#/settings" data-nav="settings">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z" stroke="currentColor" stroke-width="1.7"/><path d="M19.4 13.5a7.8 7.8 0 0 0 0-3l1.7-1.3-1.9-3.3-2 .8a7.6 7.6 0 0 0-2.6-1.5L14.3 3h-3.8l-.3 2.2a7.6 7.6 0 0 0-2.6 1.5l-2-.8-1.9 3.3 1.7 1.3a7.8 7.8 0 0 0 0 3l-1.7 1.3 1.9 3.3 2-.8a7.6 7.6 0 0 0 2.6 1.5l.3 2.2h3.8l.3-2.2a7.6 7.6 0 0 0 2.6-1.5l2 .8 1.9-3.3-1.7-1.3Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          <span>设置</span>
        </a>
      </nav>

      <div class="sidebar-foot">
        <div class="conn-card" id="conn-card">
          <div class="conn-top">
            <span class="status-dot" id="conn-dot"></span>
            <span class="conn-label" id="conn-label">演示模式</span>
          </div>
          <div class="conn-sub" id="conn-sub">未连接 Surge</div>
          <button class="btn btn-ghost btn-sm" id="btn-connect">连接 API</button>
        </div>
        <div class="version-line">Surge Console <span>v0.1</span></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn menu-btn" id="menu-btn" aria-label="菜单">
            <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
          <div>
            <div class="eyebrow" id="page-eyebrow">NETWORK TOOLBOX</div>
            <h1 class="page-title" id="page-title">概览</h1>
          </div>
        </div>
        <div class="topbar-right">
          <div class="platform-chip" id="platform-chip">
            <span class="chip-dot"></span>
            <span id="platform-text">demo</span>
          </div>
          <button class="icon-btn" id="btn-refresh" aria-label="刷新" title="刷新">
            <svg viewBox="0 0 24 24" fill="none"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4.5h-4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="icon-btn" id="btn-settings" aria-label="设置">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z" stroke="currentColor" stroke-width="1.6"/><path d="M19.4 13.5a7.8 7.8 0 0 0 0-3l1.7-1.3-1.9-3.3-2 .8a7.6 7.6 0 0 0-2.6-1.5L14.3 3h-3.8l-.3 2.2a7.6 7.6 0 0 0-2.6 1.5l-2-.8-1.9 3.3 1.7 1.3a7.8 7.8 0 0 0 0 3l-1.7 1.3 1.9 3.3 2-.8a7.6 7.6 0 0 0 2.6 1.5l.3 2.2h3.8l.3-2.2a7.6 7.6 0 0 0 2.6-1.5l2 .8 1.9-3.3-1.7-1.3Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </header>

      <div class="demo-banner" id="demo-banner" hidden>
        <div>
          <strong>演示数据</strong>
          <span>填入 API Key 后，这里会显示你 Apple TV 上的真实节点、延迟和请求。</span>
        </div>
        <button class="btn btn-primary btn-sm" id="btn-connect-banner">连接 Surge</button>
      </div>

      <section id="view" class="view" aria-live="polite"></section>

      <footer class="foot">
        <span>Surge HTTP API · 本地控制台</span>
        <span id="foot-status">等待连接</span>
      </footer>
    </main>
  </div>

  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <div>
          <div class="eyebrow">CONNECTION</div>
          <h2 id="modal-title">连接 Surge</h2>
        </div>
        <button class="icon-btn" id="modal-close" aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
      <form id="connect-form" class="modal-body">
        <label class="field">
          <span>API 地址</span>
          <input id="input-base" type="url" spellcheck="false" placeholder="http://&lt;Apple-TV-IP&gt;:6171" />
        </label>
        <label class="field">
          <span>API Key</span>
          <div class="key-row">
            <input id="input-key" type="password" spellcheck="false" placeholder="http-api 的 key" autocomplete="off" />
            <button type="button" class="icon-btn" id="toggle-key" aria-label="显示/隐藏">
              <svg viewBox="0 0 24 24" fill="none"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="2.8" stroke="currentColor" stroke-width="1.6"/></svg>
            </button>
          </div>
        </label>
        <label class="check">
          <input id="input-remember" type="checkbox" />
          <span>记住 key（保存在本机浏览器，明文）</span>
        </label>
        <div class="modal-hint" id="connect-hint">在 Surge 配置的 <code>[General]</code> 里：<code>http-api = key@0.0.0.0:6171</code>。建议只在可信局域网使用。</div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="btn-demo">先看演示</button>
          <button type="submit" class="btn btn-primary" id="btn-test-connect">连接并测试</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-backdrop" id="request-modal" hidden>
    <div class="modal req-detail" id="req-detail-panel" role="dialog" aria-modal="true" aria-labelledby="req-detail-title"></div>
  </div>

  <div class="toast-root" id="toast-root"></div>
  <script src="app.js"></script>
</body>
</html>
